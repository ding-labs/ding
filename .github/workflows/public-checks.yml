name: Public surface checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            workers/website/package-lock.json
            workers/docs/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: npm ci --prefix workers/website
      - run: npm ci --prefix workers/docs
      - run: python -m pip install -r docs/requirements.txt
      - run: npm run build --prefix workers/website
      - run: npm test --prefix workers/website
      - run: python scripts/web/build_docs.py
      - run: python scripts/web/check_links.py
      - run: python scripts/web/smoke_quickstart.py
      - run: npm run check --prefix workers/docs
      - name: Install browser for public page checks
        working-directory: workers/website
        run: npx playwright install --with-deps chromium
      - name: Check public pages in the browser
        run: npm run check:browser --prefix workers/website
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Upload complete publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-surfaces
          path: |
            workers/website/dist/
            workers/docs/site/
          include-hidden-files: true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-evidence
          path: artifacts/public-surfaces/
