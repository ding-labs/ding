name: Local download report
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [github, homebrew]
    steps:
      - uses: actions/checkout@v4
      - name: Update the private report
        run: python3 scripts/analytics/local-downloads.py "${{ matrix.source }}"
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_REPORT_SECRET: ${{ secrets.DOWNLOAD_REPORT_SECRET }}
