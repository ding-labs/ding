name: Local package qualification
on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version to embed (no v prefix)
        required: true
        default: 0.15.0-preview.1
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: windows-latest, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web/console
      - run: npm run build --prefix web/console
      - run: npm ci --prefix web/mcp-app
      - run: npm run build --prefix web/mcp-app
      - name: Native contracts (no unattended notification prompts)
        run: go test -count=1 ./internal/install ./internal/service ./internal/update ./internal/control ./internal/watchrun
      - name: Unix archive
        if: matrix.os != 'windows'
        env:
          DING_VERSION: ${{ inputs.version }}
        run: sh scripts/package-local.sh "$DING_VERSION" dist/native
      - name: macOS installer
        if: matrix.os == 'darwin'
        env:
          DING_VERSION: ${{ inputs.version }}
          DING_ARCH: ${{ matrix.arch }}
        run: sh scripts/package-macos-pkg.sh "dist/native/ding_darwin_$DING_ARCH.tar.gz" "$DING_VERSION" "dist/native/ding_darwin_$DING_ARCH.pkg"
      - name: Windows installer compiler
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Windows archive and installer
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          DING_VERSION: ${{ inputs.version }}
        run: ./scripts/package-windows.ps1 -Version $env:DING_VERSION -Output dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: unqualified-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/native/*
          if-no-files-found: error
# These are deliberately unsigned qualification artifacts, never public releases.
# Signing runs on protected release hosts, followed by native acceptance evidence
# and cmd/ding-release. This workflow cannot mutate releases, channels or packages.
