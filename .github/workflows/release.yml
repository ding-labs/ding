name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - name: Console build and browser gates
        run: |
          npm ci --prefix web/console
          npm test --prefix web/console
          npm run build --prefix web/console
          cd web/console
          npx playwright install --with-deps
          npm run test:e2e
      - name: Run tests
        run: |
          npm ci --prefix web/mcp-app
          npm run build --prefix web/mcp-app
          npm test --prefix web/mcp-app
          go vet ./...
          go test -race -tags console,mcpui ./...
      - name: Container TLS gate
        run: |
          docker build -t ding-release-check .
          scripts/container-smoke.sh ding-release-check
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --release-notes docs/releases/watch-preview.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
