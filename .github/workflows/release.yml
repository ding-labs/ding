name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, without the v prefix
        required: true
        default: '0.15.0'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check native platform and version
        run: |
          [[ "${RELEASE_VERSION#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(go env GOOS)" = '${{ matrix.os }}'
          test "$(go env GOARCH)" = '${{ matrix.arch }}'
      - name: Build embedded interfaces
        run: |
          npm ci --prefix web/console
          npm test --prefix web/console
          npm run build --prefix web/console
          npm ci --prefix web/mcp-app
          npm test --prefix web/mcp-app
          npm run build --prefix web/mcp-app
      - name: Native runtime tests
        run: |
          go mod tidy -diff
          go vet -tags console,mcpui ./...
          go test -race -tags console,mcpui -count=1 ./...
      - name: Package and verify the extracted archive
        env:
          DING_EXPECT_CONSOLE: '1'
        run: |
          sh scripts/package-local.sh "${RELEASE_VERSION#v}" dist/native
          mkdir dist/extracted
          tar -xzf dist/native/ding_${{ matrix.os }}_${{ matrix.arch }}.tar.gz -C dist/extracted
          export DING_BINARY="$PWD/dist/extracted/ding"
          go test -v -count=1 ./internal/qualification
          if [ '${{ matrix.os }}' = darwin ]; then
            codesign --verify --strict dist/extracted/DingNotifications.app
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/native/*.tar.gz
          if-no-files-found: error

  draft:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/native
      - name: Generate tap formula and checksums
        run: |
          go run ./cmd/ding-homebrew -artifacts dist/native -version "v${RELEASE_VERSION#v}" > dist/native/ding.rb
          (cd dist/native && sha256sum *.tar.gz ding.rb > checksums.txt)
      - name: Create a reviewable release draft
        run: |
          gh release create "v${RELEASE_VERSION#v}" dist/native/* \
            --target "$GITHUB_SHA" --draft --title "Ding ${RELEASE_VERSION#v}" \
            --notes-file "docs/releases/v${RELEASE_VERSION#v}.md"
# This route prepares the Homebrew distribution. Publish after reviewing CI and
# native installation evidence, then update the tap with the reviewed formula.
# Run the tap's Homebrew bottles workflow and publish its bottle block before
# advertising the Mac installation, so users do not need a matching compiler.
# It does not publish signed standalone update channels or native installers.
