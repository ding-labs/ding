site_name: DING
site_description: Stream-based alerting daemon — single binary, zero infrastructure
site_url: https://docs.ding.ing
repo_url: https://github.com/ding-labs/ding
repo_name: ding-labs/ding

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: black
    accent: green
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

docs_dir: docs

nav:
  - Home: index.md
  - Install: install.md
  - Configuration: configuration.md
  - HTTP API: api.md
  - Examples: examples.md
  - Recipes:
    - Overview: recipes/index.md
    - GitLab CI: recipes/gitlab-ci.md
    - Jenkins: recipes/jenkins.md
    - Buildkite: recipes/buildkite.md
    - Kubernetes Jobs: recipes/kubernetes-jobs.md
    - Argo Workflows: recipes/argo-workflows.md
    - MLflow: recipes/mlflow.md
    - Ray Train / Tune: recipes/ray.md
    - Modal: recipes/modal.md
  - CLI Reference:
    - ding: cli/ding.md
    - run: cli/ding_run.md
    - serve: cli/ding_serve.md
    - validate: cli/ding_validate.md
    - version: cli/ding_version.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - tables
  - attr_list
