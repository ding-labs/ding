site_name: DING
site_description: Stream-based alerting daemon — single binary, zero infrastructure
site_url: https://zuchka.github.io/ding/
repo_url: https://github.com/zuchka/ding
repo_name: zuchka/ding

theme:
  name: material
  palette:
    scheme: default
    primary: black
    accent: deep orange
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - search.suggest

docs_dir: docs

nav:
  - Home: index.md
  - Install: install.md
  - Configuration: configuration.md
  - HTTP API: api.md
  - Examples: examples.md
  - Recipes:
    - Overview: recipes/index.md
    - GitLab CI: recipes/gitlab-ci.md
    - CircleCI: recipes/circleci.md
    - Jenkins: recipes/jenkins.md
    - Buildkite: recipes/buildkite.md
  - CLI Reference:
    - ding: cli/ding.md
    - serve: cli/ding_serve.md
    - validate: cli/ding_validate.md
    - version: cli/ding_version.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - tables
  - attr_list
