site_name: Ding
site_description: Persistent watches and durable alerts for developers and agents
site_url: https://docs.ding.ing/
repo_url: https://github.com/ding-labs/ding
repo_name: ding-labs/ding
copyright: Ding · Apache-2.0
strict: true
docs_dir: docs
exclude_docs: |
  requirements.txt
  overrides/
  development/website-docs-plan.md
  development/website-docs-progress.md
  development/watch-migration.md
  development/codebase-audit.md
  development/progress.md
  development/legacy-hardening.md
  releases/legacy-hardening.md
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
hooks:
  - scripts/web/docs_hooks.py
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css
nav:
  - Start:
    - Overview: index.md
    - Install: install.md
    - First watch: guides/first-watch.md
  - Concepts:
    - Understand a watch: concepts/index.md
    - State glossary: reference/states.md
    - Configuration: configuration.md
  - Guides:
    - Examples: examples.md
    - HTTP monitoring: guides/http.md
    - Receive JSON: guides/push.md
    - Command checks: guides/command.md
    - Missing heartbeats: guides/missing-data.md
    - Changes and provider events: guides/changes.md
    - Grouped watches: guides/grouping.md
    - Investigate an alert: guides/investigate.md
    - Notifications and retry: guides/notifications.md
  - Console:
    - Build and use the Console: console/index.md
    - Console qualification: development/console-qualification.md
  - Operate:
    - Run a daemon: operate/index.md
    - Backup and upgrade: operate/backup.md
    - Troubleshooting: operate/troubleshooting.md
  - Reference:
    - Watch manifest: reference/manifest.md
    - HTTP API: api.md
  - Migration and releases:
    - Legacy migration: legacy.md
    - Watch preview: releases/watch-preview.md
    - Qualification: development/qualification.md
    - Release checklist: releases/watch-checklist.md
  - Contribute:
    - Monorepo and publishing: contribute/index.md
    - Local-first roadmap: development/local-first-roadmap.md
    - Local experience plan: development/local-experience-plan.md
    - Desktop marketplace plan: development/desktop-marketplace-plan.md
    - Cloud and adoption plan: development/ding-cloud-plan.md
    - Watch contract: development/watch-contract.md
    - Evaluation: development/evaluation-contract.md
    - Sources and destinations: development/adapter-contract.md
    - Lifecycle and limits: development/lifecycle-contract.md
    - Inspection and replay: development/inspection-contract.md
    - Transactional store: development/store-contract.md
    - HTTP runtime milestone: development/http-runtime.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - tables
  - attr_list
