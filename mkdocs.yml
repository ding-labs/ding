site_name: DING
site_description: Persistent watches and durable alerts for developers and agents
site_url: https://docs.ding.ing
repo_url: https://github.com/ding-labs/ding
repo_name: ding-labs/ding

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: black
    accent: green
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

docs_dir: docs

nav:
  - Home: index.md
  - Install: install.md
  - Configuration: configuration.md
  - Console: console.md
  - HTTP API: api.md
  - Examples: examples.md
  - Legacy migration: legacy.md
  - Qualification: development/qualification.md
  - Release checklist: releases/watch-checklist.md
  - CLI Reference:
    - ding: cli/ding.md
    - daemon: cli/ding_daemon.md
    - apply: cli/ding_apply.md
    - watch: cli/ding_watch.md
    - events: cli/ding_events.md
    - migrate: cli/ding_migrate.md
    - doctor: cli/ding_doctor.md
    - ui: cli/ding_ui.md
    - replay: cli/ding_replay.md
    - version: cli/ding_version.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - tables
  - attr_list
