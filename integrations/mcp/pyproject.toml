[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ding-mcp"
version = "0.1.0"
description = "Ding's local and self-hosted FastMCP integration"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = ["fastmcp==4.1.0", "httpx>=0.28.1,<0.29", "pydantic>=2.12,<3", "platformdirs>=4.4,<5"]

[project.scripts]
ding-mcp = "ding_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<0.15", "pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/ding_mcp"]
